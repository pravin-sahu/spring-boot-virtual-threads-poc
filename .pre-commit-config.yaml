repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master', '--branch', 'development', '--branch', 'staging']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.15.0
    hooks:
      - id: pretty-format-java
        args: [--autofix]

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit, commit-msg]

  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless Apply
        entry: mvn spotless:apply
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: spotbugs
        name: SpotBugs
        entry: mvn spotbugs:check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pmd
        name: PMD
        entry: mvn pmd:check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: unit-tests
        name: Unit Tests
        entry: mvn test
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: coverage-check
        name: Coverage Check
        entry: mvn verify
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: commitizen-check
        name: Commit Message Check (Commitizen)
        entry: cz check --commit-msg-file
        language: system
        stages: [commit-msg]
